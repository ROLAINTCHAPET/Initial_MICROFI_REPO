spring.application.name=microfi-middleware
server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=true

# CBS adapter selection; matches CoreBankingAdapter#vendor() of the active adapter bean
cbs.vendor=${CBS_VENDOR:mock}
cbs.endpoint=${CBS_ENDPOINT:}

# MICROFI's own observability stack (Prometheus/Grafana, docker-compose.yml) — this service has no
# Spring Security at all (internal-only, reached from microfi-core over the Docker network), so
# nothing further to permit; scoping which endpoints exist at all is the only control needed here.
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=microfi-middleware
# Histogram buckets for the Grafana dashboard's PR95/PR99 latency panels — without this,
# http_server_requests_seconds_bucket never exists and histogram_quantile() returns no data.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Distributed tracing (Tempo, docker-compose.yml) — inbound requests from microfi-core
# auto-instrumented via Micrometer's ObservationAutoConfiguration, trace context propagated
# automatically from the caller's WebClient span, no code changes needed on either side. Property
# is management.opentelemetry.tracing.export.otlp.endpoint in Spring Boot 4, not management.otlp.*
# (that Boot 3.x namespace doesn't exist anymore — see microfi-core's application.properties).
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://tempo:4318/v1/traces
