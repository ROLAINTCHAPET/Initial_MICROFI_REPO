services:
  postgres:
    image: postgres:16
    container_name: microfi_postgres
    environment:
      POSTGRES_USER: microfi
      POSTGRES_PASSWORD: microfi_password
      POSTGRES_DB: microfi
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: microfi_redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: microfi_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: microfi
      RABBITMQ_DEFAULT_PASS: microfi_password
    ports:
      - "15673:5672"
      - "25672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  microfi-core:
    build:
      context: ./microfi-core
      dockerfile: Dockerfile
    container_name: microfi_core
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/microfi
      - SPRING_DATASOURCE_USERNAME=microfi
      - SPRING_DATASOURCE_PASSWORD=microfi_password
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_CREATE_NAMESPACES=true
      # Never previously set — Spring Boot's RabbitMQ/Redis autoconfiguration silently defaulted
      # to localhost:5672/6379 inside this container (nothing listens there), so every RabbitMQ
      # connection attempt was failing before this. AuthEventPublisher's publish() already
      # swallows that failure by design (a broker outage must never block a login), which is
      # exactly why it went unnoticed rather than erroring loudly.
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=microfi
      - SPRING_RABBITMQ_PASSWORD=microfi_password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # How long POST /collections and /collections/sync will wait for
      # CollectionRecordListener's reply before giving up (503) — generous enough to ride out
      # queueing delay from a real reconnection burst, short enough that a genuinely stuck
      # consumer pool fails fast instead of hanging the caller indefinitely.
      - SPRING_RABBITMQ_TEMPLATE_REPLY_TIMEOUT=20000
      # Collection-record consumer pool size — the actual burst throttle (RabbitMQConfig).
      - COLLECTION_RECORD_CONSUMER_CONCURRENCY=5
      - COLLECTION_RECORD_CONSUMER_MAX_CONCURRENCY=20
      - MIDDLEWARE_BASE_URL=http://microfi-middleware:8081
      # First ADMIN account, created once at startup if none exists yet (see AdminBootstrapRunner).
      # Change these before any real deployment.
      - ADMIN_BOOTSTRAP_LOGIN=admin
      - ADMIN_BOOTSTRAP_PASSWORD=ChangeMe123!
      # UC-09/FR-09 SMS gateway (POST /collections/{id}/notify). Unset client id/secret = every
      # send fails gracefully (logged as FAILED) rather than the app failing to start.
      - SMS_VENDOR=orange
      # - ORANGE_SMS_CLIENT_ID=
      # - ORANGE_SMS_CLIENT_SECRET=
      # - ORANGE_SMS_SENDER_ADDRESS=
      # - MTN_SMS_CLIENT_ID=
      # - MTN_SMS_CLIENT_SECRET=
      # - MTN_SMS_SENDER_ADDRESS=
      # Compliance-gated registration document uploads (DocumentStorageService) — local disk,
      # matching the rest of this self-hosted stack rather than S3/MinIO.
      - REGISTRATION_DOCUMENTS_STORAGE_PATH=/data/registration-documents
      # Escrow top-up deposit proof — same mounted volume, sibling subfolder, no new volume needed.
      - ESCROW_DEPOSIT_PROOFS_STORAGE_PATH=/data/registration-documents/escrow-deposit-proofs
      # Variance-debt write-off proof — same pattern, same shared volume.
      - VARIANCE_WRITE_OFF_PROOFS_STORAGE_PATH=/data/registration-documents/variance-write-off-proofs
    volumes:
      - registration_documents:/data/registration-documents
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - microfi-middleware

  microfi-middleware:
    build:
      context: ./microfi-middleware
      dockerfile: Dockerfile
    container_name: microfi_middleware
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/microfi
      - SPRING_DATASOURCE_USERNAME=microfi
      - SPRING_DATASOURCE_PASSWORD=microfi_password
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_CREATE_NAMESPACES=true
      - CBS_VENDOR=mock
      - CBS_ENDPOINT=
    ports:
      - "18081:8081"
    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq

  kong:
    image: kong:3.7
    container_name: microfi_kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_SSL_CERT: /kong/certs/dev-cert.pem
      KONG_SSL_CERT_KEY: /kong/certs/dev-key.pem
      # Dev-only self-signed cert (kong/certs/dev-cert.pem) — TLS termination happens here per
      # architecture.txt section 3.3, but replace with a real CA-signed cert before any real
      # deployment; self-signed is fine for local/demo HTTPS testing only.
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
      - ./kong/certs:/kong/certs:ro
    ports:
      - "8000:8000"   # public proxy (HTTP) — the actual API entrypoint clients should use
      - "8443:8443"   # public proxy (HTTPS, self-signed dev cert)
      # Admin API: loopback-only. It has no auth (Kong OSS has no RBAC) and can leak the JWT
      # signing secret in plaintext via GET /consumers/{id}/jwt — binding 0.0.0.0 here would let
      # anyone who can reach the host forge admin JWTs or rewrite the gateway's own config.
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    depends_on:
      - microfi-core
      - redis

  prometheus:
    image: prom/prometheus:latest
    container_name: microfi_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      # Host port 9091, not 9090 — this machine already has an unrelated project's own Prometheus
      # bound to 9090 (xcsm-v2-back); scraping itself happens over the internal Docker network
      # regardless of this host mapping.
      - "9091:9090"
    restart: unless-stopped
    depends_on:
      - microfi-core
      - microfi-middleware

  loki:
    image: grafana/loki:latest
    container_name: microfi_loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      # Host port 3101, not 3100 — this machine already has an unrelated project's own Loki bound
      # to 3100 (~/Downloads/template); log ingestion itself happens over the internal Docker
      # network regardless of this host mapping.
      - "3101:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: microfi_promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Docker log-shipping agent's standard pattern: reads the host's container log files
      # directly, and the socket to discover which containers exist and their compose labels
      # (read-only — never issues any control commands to the daemon).
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on:
      - loki

  tempo:
    # Pinned, not :latest — v3.0 restructured the config schema in a breaking way; 2.6.1 matches
    # the well-documented monolithic-mode config this repo uses (tempo/tempo.yml).
    image: grafana/tempo:2.6.1
    container_name: microfi_tempo
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo query API — used by Grafana's Tempo datasource
      - "4318:4318"   # OTLP HTTP receiver — microfi-core/microfi-middleware export spans here
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: microfi_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # First-run only — doesn't reset the password on every restart once an admin has changed it.
      - GF_SECURITY_ADMIN_PASSWORD_RESET=false
      # Trace-to-logs correlation (Tempo datasource -> Loki) is a beta panel feature.
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # Host port 3300 — this machine's Next.js dev server already occupies 3001 (after 3000 was
      # taken by that same unrelated xcsm-v2-back Grafana instance), so this stays clearly distinct.
      - "3300:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  registration_documents:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
