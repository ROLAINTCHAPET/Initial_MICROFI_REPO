spring.application.name=microfi-core

# Without this, Spring's default error body omits "message" entirely (security default) — every
# ResponseStatusException reason and @Valid failure we deliberately wrote as a user-facing string
# was silently dropped and callers only ever saw the generic HTTP reason phrase ("Bad Request",
# "Conflict") instead. These messages never expose internals (stack traces stay off regardless).
server.error.include-message=always
server.error.include-binding-errors=always
# Security JWT Config
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 10 hours
application.security.jwt.expiration=36000000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=true

# BR-02: denomination breakdown required for deposits >= this amount. 0 = always required.
collection.denomination-threshold-xaf=0

# cbsclient -> CBS Middleware (FR-18 daily export)
middleware.base-url=${MIDDLEWARE_BASE_URL:http://localhost:8081}

# GeocodingService -> reverse-geocodes collection geotags into a display name (best-effort, never blocks a collection).
geocoding.base-url=${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}

# First ADMIN account, created at startup only if no ADMIN exists yet (see AdminBootstrapRunner).
admin.bootstrap.login=${ADMIN_BOOTSTRAP_LOGIN:}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# UC-19: flat activation/renewal fee split between agent and MFI via the CBS.
client.activation.fee-xaf=1000
# UC-19: a stuck two-party activation gate (other side never confirms) auto-expires after this
# many hours, freeing the agent to collect cash again — see ActivationRequestExpiryJob.
client.activation.pending-timeout-hours=24
client.activation.expiry-check-interval-ms=3600000

# BR-Notif-01: mandatory MFI name mention on SMS/receipt text. Bootstrap default only — an ADMIN
# can override it at runtime via GET/PUT /api/v1/admin/settings/mfi (see MfiSettingsService).
mfi.name=${MFI_NAME:MICROFI}

# UC-13 A1: how long an agent must be continuously outside their geofence before a breach becomes
# a visible alert (rather than a brief excursion / noisy single ping).
geofence.grace-period-seconds=${GEOFENCE_GRACE_PERIOD_SECONDS:120}

# UC-09/FR-09: which carrier gateway POST /collections/{id}/notify sends through. orange | mtn
sms.vendor=${SMS_VENDOR:orange}

# Orange Developer SMS API (api.orange.com/smsmessaging) — OAuth2 client-credentials.
orange.sms.base-url=${ORANGE_SMS_BASE_URL:https://api.orange.com}
orange.sms.token-uri=${ORANGE_SMS_TOKEN_URI:/oauth/v3/token}
orange.sms.client-id=${ORANGE_SMS_CLIENT_ID:}
orange.sms.client-secret=${ORANGE_SMS_CLIENT_SECRET:}
orange.sms.sender-address=${ORANGE_SMS_SENDER_ADDRESS:}

# MTN Business API (MTN Developer Portal SMS API) — OAuth2 client-credentials.
mtn.sms.base-url=${MTN_SMS_BASE_URL:https://api.mtn.com}
mtn.sms.token-uri=${MTN_SMS_TOKEN_URI:/v1/oauth/access_token}
mtn.sms.send-path=${MTN_SMS_SEND_PATH:/v1/sms/messages/sms/outbound}
mtn.sms.client-id=${MTN_SMS_CLIENT_ID:}
mtn.sms.client-secret=${MTN_SMS_CLIENT_SECRET:}
mtn.sms.sender-address=${MTN_SMS_SENDER_ADDRESS:}

# UC-01 §4.1: login (password) lockout after this many consecutive failed attempts, for this many minutes.
agent.auth.max-failed-pin-attempts=${AGENT_MAX_FAILED_PIN_ATTEMPTS:3}
agent.auth.lockout-minutes=${AGENT_LOCKOUT_MINUTES:15}

# UC-06: transaction-PIN lockout — separate counter from login, since the PIN is checked on every collection.
agent.transaction-pin.max-failed-attempts=${AGENT_TRANSACTION_PIN_MAX_FAILED_ATTEMPTS:3}
agent.transaction-pin.lockout-minutes=${AGENT_TRANSACTION_PIN_LOCKOUT_MINUTES:15}

# Compliance-gated registration (DocumentStorageService) — local disk, matching the rest of this
# self-hosted stack rather than S3/MinIO. PDF/JPEG only, 10MB/file default.
registration.documents.storage-path=${REGISTRATION_DOCUMENTS_STORAGE_PATH:./data/registration-documents}
registration.documents.max-size-bytes=${REGISTRATION_DOCUMENTS_MAX_SIZE_BYTES:10485760}
# The criminal record scan's own issue date must be this recent (not the upload date).
registration.criminal-record.max-age-days=${REGISTRATION_CRIMINAL_RECORD_MAX_AGE_DAYS:90}

# Escrow top-up deposit proof (EscrowDepositProofStorageService) — same local-disk approach as
# registration documents; reuses that same mounted volume as a sibling subfolder, no new volume needed.
escrow.deposit-proofs.storage-path=${ESCROW_DEPOSIT_PROOFS_STORAGE_PATH:./data/registration-documents/escrow-deposit-proofs}
escrow.deposit-proofs.max-size-bytes=${ESCROW_DEPOSIT_PROOFS_MAX_SIZE_BYTES:10485760}

