<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Microfi - End-of-Day Reconciliation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#002019",
                        "on-tertiary-fixed-variant": "#5e4200",
                        "on-surface-variant": "#43474d",
                        "tertiary-fixed": "#ffdea8",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e0e3e6",
                        "on-tertiary-fixed": "#271900",
                        "primary-container": "#0a2540",
                        "on-primary-container": "#768dad",
                        "surface-container-highest": "#e0e3e6",
                        "on-secondary-fixed-variant": "#005142",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e5e8eb",
                        "surface-bright": "#f7fafd",
                        "on-background": "#181c1e",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "primary": "#000f22",
                        "inverse-on-surface": "#eef1f4",
                        "inverse-surface": "#2d3133",
                        "secondary-fixed-dim": "#27dfbc",
                        "on-tertiary-container": "#b68200",
                        "surface-tint": "#49607e",
                        "on-surface": "#181c1e",
                        "secondary-container": "#55fcd8",
                        "tertiary": "#170d00",
                        "on-primary-fixed": "#001c37",
                        "surface-container-low": "#f1f4f7",
                        "primary-fixed-dim": "#b0c8eb",
                        "outline": "#74777e",
                        "outline-variant": "#c4c6ce",
                        "tertiary-container": "#322100",
                        "on-error-container": "#93000a",
                        "surface-dim": "#d7dadd",
                        "background": "#f7fafd",
                        "tertiary-fixed-dim": "#ffba20",
                        "secondary": "#006b59",
                        "on-secondary-container": "#00725f",
                        "primary-fixed": "#d2e4ff",
                        "surface-container": "#ebeef1",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#b0c8eb",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#55fcd8",
                        "on-primary-fixed-variant": "#314865",
                        "surface": "#f7fafd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "stack-lg": "24px",
                        "stack-sm": "8px",
                        "touch-target": "48px"
                    },
                    "fontFamily": {
                        "label-bold": ["Inter"],
                        "body": ["Inter"],
                        "caption": ["Inter"],
                        "h2": ["Inter"],
                        "h1": ["Inter"],
                        "display": ["Inter"]
                    },
                    "fontSize": {
                        "label-bold": ["13px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body": ["15px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "h2": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "h1": ["22px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body">
<!-- TopAppBar -->
<header class="bg-primary dark:bg-primary-container text-on-primary dark:text-on-primary-container font-h1 text-h1 docked full-width top-0 border-b border-outline dark:border-outline-variant flat no shadows fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target">
<button class="flex items-center justify-center w-touch-target h-touch-target hover:bg-primary-fixed-dim/10 scale-95 duration-75 text-on-primary dark:text-on-primary-container">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<span class="font-display text-display text-on-primary dark:text-on-primary-container font-bold tracking-tight">Microfi</span>
<button class="flex items-center justify-center w-touch-target h-touch-target hover:bg-primary-fixed-dim/10 scale-95 duration-75 text-on-primary dark:text-on-primary-container">
<span class="material-symbols-outlined" data-icon="signal_wifi_4_bar">signal_wifi_4_bar</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-[48px] px-margin-mobile py-stack-lg max-w-md mx-auto w-full flex flex-col gap-stack-lg">
<!-- Header / Title -->
<div class="flex flex-col gap-stack-sm">
<h2 class="font-h1 text-h1 text-primary">End-of-Day (OFJ)</h2>
<p class="font-body text-body text-on-surface-variant">Reconciliation Screen</p>
</div>
<!-- Status Banner -->
<div class="bg-tertiary-fixed text-on-tertiary-fixed border border-on-tertiary-fixed-variant rounded-DEFAULT p-stack-md flex items-start gap-stack-sm shadow-sm">
<span class="material-symbols-outlined text-on-tertiary-fixed-variant mt-1" data-icon="lock">lock</span>
<div>
<h3 class="font-h2 text-h2 text-on-tertiary-fixed-variant">Reconciliation Locked</h3>
<p class="font-body text-body text-on-tertiary-fixed mt-1">[1] Pending Sync. Awaiting network confirmation before closing.</p>
</div>
</div>
<!-- Reconciliation Data Bento -->
<div class="grid grid-cols-1 gap-stack-md">
<!-- Digital Total -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-DEFAULT p-stack-md flex justify-between items-center h-[64px]">
<div class="flex items-center gap-stack-sm text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="smartphone">smartphone</span>
<span class="font-body text-body">Total Digital</span>
</div>
<div class="font-h2 text-h2 text-primary">450,000 XAF</div>
</div>
<!-- Physical Total -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-DEFAULT p-stack-md flex justify-between items-center h-[64px]">
<div class="flex items-center gap-stack-sm text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-body text-body">Total Physical</span>
</div>
<div class="font-h2 text-h2 text-primary">445,000 XAF</div>
</div>
<!-- Variance -->
<div class="bg-error-container text-on-error-container border-2 border-error rounded-DEFAULT p-stack-lg flex flex-col items-center justify-center gap-stack-sm mt-stack-sm">
<span class="font-label-bold text-label-bold tracking-widest uppercase">Δ Variance</span>
<span class="font-display text-display text-error font-extrabold">-5,000 XAF</span>
</div>
</div>
<!-- Spacer to push action to bottom if needed -->
<div class="flex-1"></div>
<!-- Action Area -->
<div class="mt-stack-lg pb-stack-lg">
<button class="w-full h-touch-target bg-surface-variant text-outline rounded-DEFAULT font-label-bold text-label-bold flex items-center justify-center gap-2 cursor-not-allowed border border-outline-variant opacity-70" disabled="">
<span class="material-symbols-outlined" data-icon="lock_clock">lock_clock</span>
                Close Day
            </button>
<p class="text-center font-caption text-caption text-on-surface-variant mt-stack-sm">Cannot close day with pending syncs or unresolved variance.</p>
</div>
</main>
<!-- BottomNavBar Suppressed: Intent is transactional/task-focused (End-of-day close). -->
</body></html>
