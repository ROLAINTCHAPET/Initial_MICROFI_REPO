auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  # Promtail backfills from the start of each container's existing log file on first run — some
  # of this stack's containers (postgres, rabbitmq, ...) have been running for weeks, so without
  # this Loki rejects that entire historical backlog as "too old" (default max age is 7 days).
  reject_old_samples: false
